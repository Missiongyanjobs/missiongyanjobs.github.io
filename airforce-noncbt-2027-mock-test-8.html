<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR FORCE NON-COMBATANT 01/2027 - Practice Set 04 | Mission Gyan Jobs</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial;}
body{background:#1a0000; padding:15px}
.container{max-width:850px; margin:auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 0 20px rgba(255,0,0,0.5); border:2px solid #ff0000}
.header{text-align:center; border-bottom:3px solid #ff0000; padding:15px; margin-bottom:20px; background:linear-gradient(90deg, #8B0000, #ff0000); color:white; border-radius:8px}
.header h1{font-size:19px;}
.section-title{background:#0f172a; color:#fbbf24; padding:10px 15px; border-radius:6px; margin:20px 0 15px 0; font-size:18px; font-weight:800; text-align:center; border:1px solid #fbbf24}
.timer{font-size:18px; font-weight:bold; color:#ff0000; text-align:right; margin-bottom:15px; animation: blink 1s infinite}
@keyframes blink{0%,50%{opacity:1} 51%,100%{opacity:0.3}}
.question-box{margin-bottom:25px; padding:18px; border:2px solid #ffcccc; border-radius:10px; background:linear-gradient(135deg, #fff5f5, #ffffff)}
.q-no{background:#8B0000; color:white; padding:6px 14px; border-radius:5px; display:inline-block; margin-bottom:10px; font-weight:bold; font-size:16px}
.q-text{font-size:16px; margin-bottom:12px; font-weight:600}
.options label{display:block; padding:12px; margin:8px 0; background:white; border:2px solid #ddd; border-radius:8px; cursor:pointer; transition:0.3s; font-weight:500}
.options label:hover{border-color:#ff0000; background:#fff0f0; transform:translateX(8px)}
.btn{background:linear-gradient(90deg, #ff0000, #8B0000); color:white; padding:14px 30px; border:none; border-radius:8px; font-size:17px; cursor:pointer; display:block; margin:20px auto; font-weight:bold; box-shadow:0 0 15px rgba(255,0,0,0.7)}
#result{font-size:24px; font-weight:bold; text-align:center; margin:20px 0; color:#008000; background:#e6ffe6; padding:15px; border-radius:8px}
.correct-option{background:#d4ffd4 !important; border:2px solid #00aa00 !important; color:#006600; font-weight:bold}
.wrong-option{background:#ffd4d4 !important; border:2px solid #ff0000 !important; color:#aa0000; font-weight:bold}
.answer{color:#008000; font-weight:bold; margin-top:10px; padding:8px; background:#e6ffe6; border-left:4px solid #008000}
#password-screen{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; justify-content:center; align-items:center; z-index:999}
.pass-box{background:linear-gradient(180deg, #8B0000, #ff0000); padding:30px; border-radius:15px; text-align:center; width:90%; max-width:400px; border:3px solid yellow; box-shadow:0 0 25px red}
.pass-box h2{color:yellow; margin-bottom:15px; font-size:24px; text-shadow:0 0 10px #fff}
.pass-box p{color:white; margin-bottom:15px}
.pass-box input{width:100%; padding:12px; font-size:16px; border:3px solid yellow; border-radius:6px; margin-bottom:15px; text-align:center; font-weight:bold}
.pass-box button{width:100%; padding:12px; background:yellow; color:#8B0000; border:none; border-radius:6px; font-size:17px; cursor:pointer; font-weight:bold}
.error{color:yellow; margin-top:10px; display:none; font-weight:bold}
</style>
</head>
<body>
<div id="password-screen">
  <div class="pass-box">
    <h2>🔥 TEST LOCKED 🔥</h2>
    <p>Password dalo</p>
    <input type="password" id="passInput" placeholder="Password">
    <button onclick="checkPassword()">START TEST NOW</button>
    <p class="error" id="errorMsg">❌ Galat Password!</p>
  </div>
</div>
<div class="container" id="main-test" style="display:none;">
<div class="header"><h1 id="test-title"></h1><p id="test-subject"></p></div>
<div class="timer" id="timer">⏰ Time Left: 20:00</div>
<form id="quiz-form"></form>
<button class="btn" onclick="submitTest()">🔥 SUBMIT TEST 🔥</button>
<div id="result"></div>
</div>
<script>
const correctPass = "MGE@77";
function checkPassword(){
  let pass = document.getElementById('passInput').value;
  if(pass === correctPass){
    document.getElementById('password-screen').style.display = 'none';
    document.getElementById('main-test').style.display = 'block';
    startTimer();
  }else{ document.getElementById('errorMsg').style.display = 'block'; }
}
const testData = {

    {"id": 10, "section": "GK", "question_hi": "'कथक' (Kathak) किस राज्य का प्रमुख शास्त्रीय नृत्य है?", "question_en": "'Kathak' is the major classical dance of which state?", "options": {"A": "केरल / Kerala", "B": "उत्तर प्रदेश / Uttar Pradesh", "C": "तमिलनाडु / Tamil Nadu", "D": "मणिपुर / Manipur"}, "answer": "B"},

    {"id": 12, "section": "GK", "question_hi": "दक्षिण कोरिया (South Korea) की राजधानी क्या है?", "question_en": "What is the capital of South Korea?", "options": {"A": "प्योंगयांग / Pyongyang", "B": "सियोल / Seoul", "C": "टोक्यो / Tokyo", "D": "बीजिंग / Beijing"}, "answer": "B"},
    {"id": 13, "section": "GK", "question_hi": "अंतरिक्ष में जाने वाली भारतीय मूल की पहली महिला कौन थीं?", "question_en": "Who was the first woman of Indian origin to go to space?", "options": {"A": "सुनीता विलियम्स / Sunita Williams", "B": "कल्पना चावला / Kalpana Chawla", "C": "सिरीशा बांदला / Sirisha Bandla", "D": "शॉनन ल्यूसिड / Shannon Lucid"}, "answer": "B"},
    {"id": 14, "section": "GK", "question_hi": "साधारण नमक (Common Salt) का रासायनिक सूत्र क्या है?", "question_en": "What is the chemical formula of Common Salt?", "options": {"A": "H2O", "B": "CO2", "C": "NaCl", "D": "HCl"}, "answer": "C"},
    {"id": 15, "section": "GK", "question_hi": "भारत का राष्ट्रगान 'जन गण मन' मूल रूप से किस भाषा में लिखा गया था?", "question_en": "The National Anthem of India 'Jana Gana Mana' was originally written in which language?", "options": {"A": "हिंदी / Hindi", "B": "संस्कृत / Sanskrit", "C": "बंगाली / Bengali", "D": "उर्दू / Urdu"}, "answer": "C"},
    {"id": 16, "section": "ENGLISH", "question_hi": "He _____ a letter to his friend yesterday.", "question_en": "He _____ a letter to his friend yesterday.", "options": {"A": "writes", "B": "written", "C": "wrote", "D": "will write"}, "answer": "C"},
    {"id": 17, "section": "ENGLISH", "question_hi": "She is _____ European citizen.", "question_en": "She is _____ European citizen.", "options": {"A": "a", "B": "an", "C": "the", "D": "no article"}, "answer": "A"},
    {"id": 18, "section": "ENGLISH", "question_hi": "They are playing chess. (Passive)", "question_en": "They are playing chess. (Passive)", "options": {"A": "Chess is being played by them.", "B": "Chess is played by them.", "C": "Chess was played by them.", "D": "Chess has been played by them."}, "answer": "A"},
    {"id": 19, "section": "ENGLISH", "question_hi": "He said to me, 'Where are you going?' (Indirect)", "question_en": "He said to me, 'Where are you going?'", "options": {"A": "He asked me where I was going.", "B": "He asked me where was I going.", "C": "He asked to me where I am going.", "D": "He said to me that where I was going."}, "answer": "A"},
    {"id": 20, "section": "ENGLISH", "question_hi": "One of my friend / has / bought / a new car. (Error)", "question_en": "One of my friend / has / bought / a new car.", "options": {"A": "One of my friend", "B": "has", "C": "bought", "D": "a new car"}, "answer": "A"},
    {"id": 21, "section": "ENGLISH", "question_hi": "He is very good _____ Mathematics.", "question_en": "He is very good _____ Mathematics.", "options": {"A": "in", "B": "at", "C": "with", "D": "about"}, "answer": "B"},
    {"id": 22, "section": "ENGLISH", "question_hi": "The train _____ before I reached the station.", "question_en": "The train _____ before I reached the station.", "options": {"A": "left", "B": "has left", "C": "had left", "D": "was leaving"}, "answer": "C"},
    {"id": 23, "section": "ENGLISH", "question_hi": "No sooner did he see the tiger _____ he ran away.", "question_en": "No sooner did he see the tiger _____ he ran away.", "options": {"A": "when", "B": "then", "C": "than", "D": "and"}, "answer": "C"},

    {"id": 26, "section": "ENGLISH", "question_hi": "Antonym of Diligent:", "question_en": "Antonym of Diligent:", "options": {"A": "Hardworking", "B": "Lazy", "C": "Clever", "D": "Active"}, "answer": "B"},
    {"id": 27, "section": "ENGLISH", "question_hi": "The life history of a person written by himself.", "question_en": "The life history of a person written by himself.", "options": {"A": "Biography", "B": "History", "C": "Autobiography", "D": "Novel"}, "answer": "C"},
    {"id": 28, "section": "ENGLISH", "question_hi": "Idiom: To add fuel to the fire", "question_en": "Meaning of 'To add fuel to the fire':", "options": {"A": "To make a fire burn brighter", "B": "To make a bad situation worse", "C": "To help someone in need", "D": "To start a new project"}, "answer": "B"},
    {"id": 29, "section": "ENGLISH", "question_hi": "Correctly spelt word:", "question_en": "Correctly spelt word:", "options": {"A": "Vaccum", "B": "Vacum", "C": "Vacuum", "D": "Vaccuum"}, "answer": "C"},
    {"id": 30, "section": "ENGLISH", "question_hi": "Correct sentence:", "question_en": "Choose the correct sentence:", "options": {"A": "He didn't went to the market.", "B": "He didn't go to the market.", "C": "He didn't gone to the market.", "D": "He doesn't went to the market."}, "answer": "B"}
  ]
};
document.getElementById('test-title').innerText = testData.title;
document.getElementById('test-subject').innerText = testData.subject;
let quizHTML = ''; let currentSection = '';
testData.questions.forEach((q) => {
  if(currentSection !== q.section){
    currentSection = q.section;
    quizHTML += `<div class="section-title">📚 ${currentSection}</div>`;
  }
  quizHTML += `<div class="question-box" id="qbox${q.id}"><div class="q-no">Q${q.id} [${q.section}]</div><div class="q-text">${q.question_hi}<br><span style="color:#666; font-size:14px; font-weight:400">${q.question_en}</span></div><div class="options">`;
  for(let key in q.options){ quizHTML += `<label><input type="radio" name="q${q.id}" value="${key}" style="margin-right:8px"> <b>${key}.</b> ${q.options[key]}</label>`; }
  quizHTML += `</div></div>`;
});
document.getElementById('quiz-form').innerHTML = quizHTML;
let time = 20 * 60; let timerInterval;
function startTimer(){
  timerInterval = setInterval(()=>{
    let m = Math.floor(time/60), s = time%60;
    document.getElementById('timer').innerText = `⏰ Time Left: ${m}:${s<10?'0':''}${s}`;
    if(time <= 0){ clearInterval(timerInterval); submitTest(); }
    time--;
  },1000);
}
function submitTest(){
  clearInterval(timerInterval);
  let score = 0;
  testData.questions.forEach((q) => {
    let selected = document.querySelector(`input[name="q${q.id}"]:checked`);
    let qbox = document.getElementById(`qbox${q.id}`);
    let allLabels = qbox.querySelectorAll('label');
    allLabels.forEach(label => {
        let input = label.querySelector('input');
        if(input.value === q.answer){ label.classList.add('correct-option'); }
        if(selected && input.value === selected.value && selected.value !== q.answer){ label.classList.add('wrong-option'); }
    });
    if(selected && selected.value === q.answer){ score++; }
    qbox.innerHTML += `<div class="answer">✅ Correct Answer: ${q.answer}. ${q.options[q.answer]}</div>`;
  });
  document.getElementById('result').innerText = `🏆 Final Score: ${score} / ${testData.questions.length}`;
  document.querySelector('.btn').style.display = 'none';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
