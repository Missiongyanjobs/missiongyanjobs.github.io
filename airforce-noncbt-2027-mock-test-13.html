<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Force Non-CBT 01/2027 Mock Test 13 - GK + English | Mission Gyan Jobs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f1f5f9;padding:12px}
.box{max-width:750px;margin:0 auto;background:#fff;border:2px solid #B91C1C;border-radius:10px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.header{background:linear-gradient(90deg,#B91C1C,#dc2626);color:#fff;padding:14px;text-align:center;font-weight:800;font-size:18px}
.info{padding:10px 14px;background:#fffbeb;border-bottom:1px solid #fde68a;font-size:13px;font-weight:600;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.qbox{padding:14px 12px;border-bottom:1px solid #e5e7eb}
.q{font-size:15px;font-weight:700;margin-bottom:10px;color:#0f172a}
.opt{padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;margin:6px 0;cursor:pointer;font-size:14px}
.opt:hover{background:#f8fafc;border-color:#fbbf24}
.opt.correct{background:#dcfce7;border-color:#22c55e;color:#14532d;font-weight:700}
.opt.wrong{background:#fee2e2;border-color:#ef4444;color:#7f1d1d;font-weight:700}
.btn{display:block;width:95%;margin:15px auto;background:linear-gradient(90deg,#0f172a,#1e3a8a);color:#fbbf24;padding:14px;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer}
.result{padding:16px;text-align:center;display:none}
.pass-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.95);z-index:9999;display:flex;align-items:center;justify-content:center}
.pass-box{background:#fff;padding:22px;border-radius:14px;max-width:360px;width:90%;text-align:center;border:3px solid #fbbf24}
.pass-box input{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;margin:12px 0;font-size:15px}
.pass-box button{width:100%;padding:12px;background:#0f172a;color:#fbbf24;border:none;border-radius:8px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="pass-overlay" id="passOverlay">
  <div class="pass-box">
    <h3 style="color:#B91C1C">🔒 Password Protected</h3>
    <p style="font-size:13px;margin:8px 0">Password: MGE@77<br><a href="https://t.me/Missiongyanexams1" target="_blank" style="color:#229ED9;font-weight:800">📢 Join Telegram</a></p>
    <input type="password" id="passInput" placeholder="Enter Password MGE@77">
    <button onclick="checkPass()">UNLOCK TEST 13</button>
    <p id="passErr" style="color:red;font-size:12px;margin-top:8px;display:none">Wrong Password!</p>
  </div>
</div>
<div class="box">
<div class="header">🔥 AIR FORCE NON-CBT 01/2027 - TEST 13 (100% VERIFIED) 🔥</div>
<div class="info"><span>⏱️ 20 Min</span><span>📝 30 Qs</span><span>📚 GK (15) + English (15)</span><span style="color:#16a34a">✅ Verified</span></div>
<div id="quiz"></div>
<button class="btn" onclick="submitTest()">SUBMIT TEST - RESULT + ANSWER KEY</button>
<div class="result" id="result"></div>
</div>
<script>
const quizData=[
{q:"Q1. 'घूमर' किस राज्य का पारंपरिक लोक नृत्य है? / Ghoomar Folk Dance of which State?",opts:["A) गुजरात","B) राजस्थान (Rajasthan) ✅","C) पंजाब","D) मध्य प्रदेश"],ans:1,exp:"Ghoomar - Rajasthan ka famous folk dance, Bhil tribe se start hua"},
{q:"Q2. भारतीय वायु सेना दिवस कब मनाया जाता है? / Air Force Day date?",opts:["A) 15 जनवरी","B) 8 अक्टूबर (8 October) ✅","C) 4 दिसंबर","D) 26 जनवरी"],ans:1,exp:"IAF Day: 8 Oct 1932 ko IAF establish hua tha"},
{q:"Q3. 'Siachen Glacier' किस UT में है?",opts:["A) लद्दाख (Ladakh) ✅","B) जम्मू और कश्मीर","C) हिमाचल","D) उत्तराखंड"],ans:0,exp:"Siachen Glacier - Ladakh UT me, World's highest battlefield"},
{q:"Q4. भारतीय नौसेना दिवस कब?",opts:["A) 15 जनवरी","B) 4 दिसंबर (4 December) ✅","C) 8 अक्टूबर","D) 26 जनवरी"],ans:1,exp:"Navy Day: 4 Dec - 1971 Indo-Pak war me Operation Trident ki yaad me"},
{q:"Q5. 'सांची स्तूप' किस राज्य में?",opts:["A) राजस्थान","B) मध्य प्रदेश (Madhya Pradesh) ✅","C) उत्तर प्रदेश","D) बिहार"],ans:1,exp:"Sanchi Stupa - MP me, Ashoka ne banwaya tha, UNESCO site"},
{q:"Q6. भारत का राष्ट्रीय जलीय जीव? / National Aquatic Animal?",opts:["A) मगरमच्छ","B) गंगा डॉल्फिन (Ganges Dolphin) ✅","C) कछुआ","D) व्हेल"],ans:1,exp:"National Aquatic Animal: Ganga Dolphin - 2010 me declare"},
{q:"Q7. 'हिराकुंड बांध' किस नदी पर? / Hirakud Dam on which River?",opts:["A) गोदावरी","B) कृष्णा","C) महानदी (Mahanadi) ✅","D) नर्मदा"],ans:2,exp:"Hirakud Dam - Mahanadi, Odisha - India ka longest dam"},
{q:"Q8. भारतीय सेना दिवस कब? / Army Day?",opts:["A) 15 जनवरी (15 January) ✅","B) 26 जनवरी","C) 4 दिसंबर","D) 8 अक्टूबर"],ans:0,exp:"Army Day: 15 Jan 1949 - Gen KM Cariappa first Indian Army Chief bane"},
{q:"Q9. 'भाखड़ा नांगल' किस नदी पर? / Bhakra Nangal Project?",opts:["A) गंगा","B) यमुना","C) सतलुज (Sutlej) ✅","D) ब्रह्मपुत्र"],ans:2,exp:"Bhakra Nangal - Sutlej River par, HP-Punjab border"},
{q:"Q10. 'बिहू' किस राज्य का त्योहार? / Bihu festival?",opts:["A) असम (Assam) ✅","B) ओडिशा","C) मणिपुर","D) त्रिपुरा"],ans:0,exp:"Bihu - Assam ka main harvest festival"},
{q:"Q11. राष्ट्रीय खेल दिवस कब? / National Sports Day?",opts:["A) 29 अगस्त (29 August) ✅","B) 15 अगस्त","C) 26 जनवरी","D) 21 जून"],ans:0,exp:"29 Aug - Major Dhyan Chand ke birthday par"},
{q:"Q12. 'रानी की वाव' कहाँ है? / Rani Ki Vav located?",opts:["A) गुजरात (Gujarat) ✅","B) राजस्थान","C) मध्य प्रदेश","D) महाराष्ट्र"],ans:0,exp:"Rani Ki Vav - Patan, Gujarat - UNESCO World Heritage stepwell"},
{q:"Q13. 'INS Vikrant' क्या है? / What is INS Vikrant?",opts:["A) पनडुब्बी","B) युद्धक टैंक","C) विमानवाहक पोत (Aircraft Carrier) ✅","D) लड़ाकू विमान"],ans:2,exp:"INS Vikrant - India ka pehla indigenous Aircraft Carrier"},
{q:"Q14. 'नंदा देवी राष्ट्रीय उद्यान' कहाँ? / Nanda Devi National Park?",opts:["A) हिमाचल","B) उत्तराखंड (Uttarakhand) ✅","C) सिक्किम","D) अरुणाचल"],ans:1,exp:"Nanda Devi NP - Uttarakhand me, UNESCO site"},
{q:"Q15. संविधान कब अपनाया गया? / Constitution adopted?",opts:["A) 15 Aug 1947","B) 26 Jan 1950","C) 26 Nov 1949 (26 November 1949) ✅","D) 9 Dec 1946"],ans:2,exp:"Adopted: 26 Nov 1949, लागू: 26 Jan 1950"},
{q:"Q16. If it rains, we _____ the match.",opts:["A) cancel","B) will cancel ✅","C) canceled","D) has canceled"],ans:1,exp:"First Conditional: If + present, will + V1"},
{q:"Q17. _____ Earth revolves around the sun.",opts:["A) A","B) An","C) The ✅","D) No article"],ans:2,exp:"Unique objects (Earth, Sun, Moon) ke saath 'The'"},
{q:"Q18. Error: He have / bought / a new / mobile phone.",opts:["A) He have ✅ - Error","B) bought","C) a new","D) mobile phone"],ans:0,exp:"He ke saath 'has' aayega, 'have' nahi. He has bought"},
{q:"Q19. She was very angry _____ my behavior.",opts:["A) on","B) in","C) at ✅","D) to"],ans:2,exp:"angry at - kisi cheez/bat par gussa, angry with - kisi vyakti par"},
{q:"Q20. Neither of the girls _____ completed the task.",opts:["A) have","B) has ✅","C) are","D) were"],ans:1,exp:"Neither/Either singular verb leta hai - Neither has"},
{q:"Q21. Antonym of 'Reveal'",opts:["A) Show","B) Hide ✅","C) Open","D) Tell"],ans:1,exp:"Reveal = dikhana, Hide = chhupana - opposite"},
{q:"Q22. A person who cannot read or write.",opts:["A) Literate","B) Scholar","C) Illiterate ✅","D) Genius"],ans:2,exp:"Illiterate = anpadh, jo likh-padh na sake"},
{q:"Q23. Idiom 'By leaps and bounds'",opts:["A) Very slowly","B) Very quickly ✅","C) To jump high","D) In a bad way"],ans:1,exp:"By leaps and bounds = bahut tezi se progress karna"},
{q:"Q24. Passive: She sings a song.",opts:["A) A song was sung","B) A song is sung by her ✅","C) is being sung","D) has been sung"],ans:1,exp:"Simple Present Passive: is + V3"},
{q:"Q25. He said to me, 'I am busy.' -> Indirect",opts:["A) He told me that he was busy ✅","B) He said to me that I was busy","C) He told me that he is busy","D) He asks me if he was busy"],ans:0,exp:"am -> was, said to -> told, I -> he"},
{q:"Q26. Study hard _____ you will fail the exam.",opts:["A) but","B) and","C) otherwise ✅","D) because"],ans:2,exp:"otherwise = warna. Study hard otherwise you will fail"},
{q:"Q27. The highest _____ of the mountain was covered in snow.",opts:["A) peak ✅","B) peek","C) pick","D) peck"],ans:0,exp:"peak = choti, peek = jhankna - mountain ki peak"},
{q:"Q28. Synonym of 'Lethal'",opts:["A) Harmless","B) Safe","C) Deadly ✅","D) Weak"],ans:2,exp:"Lethal = ghatak, jaanlewa = Deadly"},
{q:"Q29. Correctly spelt word",opts:["A) Comitee","B) Commitee","C) Committee ✅","D) Comittee"],ans:2,exp:"Committee - double m, double t, double e"},
{q:"Q30. Choose the correct sentence",opts:["A) I have seen him yesterday","B) I saw him yesterday ✅","C) I had seen him yesterday","D) I see him yesterday"],ans:1,exp:"Yesterday = Simple Past, isliye 'saw' - 'have seen' present perfect yesterday ke saath galat"}
];
let html=""; quizData.forEach((q,i)=>{
html+=`<div class="qbox" id="q${i}"><div class="q">${q.q}</div>`;
q.opts.forEach((o,j)=>{html+=`<div class="opt" onclick="select(${i},${j})" id="q${i}o${j}">${o}</div>`});
html+=`<div style="font-size:12px;color:#14532d;background:#dcfce7;padding:8px;border-radius:6px;margin-top:8px;display:none" id="exp${i}">✅ ${q.exp}</div></div>`;
}); document.getElementById("quiz").innerHTML=html;
let selected=new Array(quizData.length).fill(-1);
function select(q,o){selected[q]=o; document.querySelectorAll(`#q${q} .opt`).forEach(el=>el.classList.remove('correct','wrong')); document.getElementById(`q${q}o${o}`).classList.add('correct');}
function submitTest(){
let score=0; quizData.forEach((q,i)=>{
document.getElementById(`exp${i}`).style.display="block";
if(selected[i]==q.ans){score++;}else{
if(selected[i]>=0) document.getElementById(`q${i}o${selected[i]}`).classList.add('wrong');
document.getElementById(`q${i}o${q.ans}`).classList.add('correct');
}
});
document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML=`<h2 style="color:${score>=18?'#16a34a':'#dc2626'}">Score: ${score}/${quizData.length}</h2><p style="font-size:13px;margin:8px 0">100% Verified Answer Key - All Correct Answers Shown in Green</p><a href="index.html" style="display:inline-block;margin-top:10px;background:#fbbf24;color:#0f172a;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:800">🏠 Back to Home</a>`;
window.scrollTo(0,document.body.scrollHeight);
}
function checkPass(){if(document.getElementById("passInput").value==="MGE@77"){document.getElementById("passOverlay").style.display="none";}else{document.getElementById("passErr").style.display="block";}}
</script>
</body>
</html>
