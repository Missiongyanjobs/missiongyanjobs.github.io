<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR FORCE NON-COMBATANT 01/2027 - GK TEST 6 | Mission Gyan Jobs</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial;}
body{background:#1a0000; padding:15px}
.container{max-width:850px; margin:auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 0 20px rgba(255,0,0,0.5); border:2px solid #ff0000}
.header{text-align:center; border-bottom:3px solid #ff0000; padding:15px; margin-bottom:20px; background:linear-gradient(90deg, #8B0000, #ff0000); color:white; border-radius:8px}
.header h1{font-size:20px; text-shadow:0 0 5px #fff}
.section-title{background:#0f172a; color:#fbbf24; padding:10px 15px; border-radius:6px; margin:20px 0 15px 0; font-size:18px; font-weight:800; text-align:center; border:1px solid #fbbf24}
.timer{font-size:18px; font-weight:bold; color:#ff0000; text-align:right; margin-bottom:15px; animation: blink 1s infinite}
@keyframes blink{0%,50%{opacity:1} 51%,100%{opacity:0.3}}
.question-box{margin-bottom:25px; padding:18px; border:2px solid #ffcccc; border-radius:10px; background:linear-gradient(135deg, #fff5f5, #ffffff)}
.q-no{background:#8B0000; color:white; padding:6px 14px; border-radius:5px; display:inline-block; margin-bottom:10px; font-weight:bold; font-size:16px}
.q-text{font-size:16px; margin-bottom:12px; font-weight:600}
.options label{display:block; padding:12px; margin:8px 0; background:white; border:2px solid #ddd; border-radius:8px; cursor:pointer; transition:0.3s; font-weight:500}
.options label:hover{border-color:#ff0000; background:#fff0f0; transform:translateX(8px)}
.btn{background:linear-gradient(90deg, #ff0000, #8B0000); color:white; padding:14px 30px; border:none; border-radius:8px; font-size:17px; cursor:pointer; display:block; margin:20px auto; font-weight:bold; box-shadow:0 0 15px rgba(255,0,0,0.7)}
#result{font-size:24px; font-weight:bold; text-align:center; margin:20px 0; color:#008000; background:#e6ffe6; padding:15px; border-radius:8px}
.correct-option{background:#d4ffd4 !important; border:2px solid #00aa00 !important; color:#006600; font-weight:bold}
.wrong-option{background:#ffd4d4 !important; border:2px solid #ff0000 !important; color:#aa0000; font-weight:bold}
.answer{color:#008000; font-weight:bold; margin-top:10px; padding:8px; background:#e6ffe6; border-left:4px solid #008000}
#password-screen{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; justify-content:center; align-items:center; z-index:999}
.pass-box{background:linear-gradient(180deg, #8B0000, #ff0000); padding:30px; border-radius:15px; text-align:center; width:90%; max-width:400px; border:3px solid yellow; box-shadow:0 0 25px red}
.pass-box h2{color:yellow; margin-bottom:15px; font-size:24px; text-shadow:0 0 10px #fff}
.pass-box p{color:white; margin-bottom:15px}
.pass-box input{width:100%; padding:12px; font-size:16px; border:3px solid yellow; border-radius:6px; margin-bottom:15px; text-align:center; font-weight:bold}
.pass-box button{width:100%; padding:12px; background:yellow; color:#8B0000; border:none; border-radius:6px; font-size:17px; cursor:pointer; font-weight:bold}
.error{color:yellow; margin-top:10px; display:none; font-weight:bold}
</style>
</head>
<body>
<div id="password-screen">
  <div class="pass-box">
    <h2>🔥 TEST LOCKED 🔥</h2>
    <p>Test start karne ke liye password dalo</p>
    <input type="password" id="passInput" placeholder="Password">
    <button onclick="checkPassword()">START TEST NOW</button>
    <p class="error" id="errorMsg">❌ Galat Password! try again</p>
  </div>
</div>
<div class="container" id="main-test" style="display:none;">
<div class="header"><h1 id="test-title"></h1><p id="test-subject"></p></div>
<div class="timer" id="timer">⏰ Time Left: 20:00</div>
<form id="quiz-form"></form>
<button class="btn" onclick="submitTest()">🔥 SUBMIT TEST 🔥</button>
<div id="result"></div>
</div>
<script>
const correctPass = "MGE@77";
function checkPassword(){
  let pass = document.getElementById('passInput').value;
  if(pass === correctPass){
    document.getElementById('password-screen').style.display = 'none';
    document.getElementById('main-test').style.display = 'block';
    startTimer();
  }else{ document.getElementById('errorMsg').style.display = 'block'; }
}
const testData = {

    {"id": 4, "section": "GK", "question_hi": "अरलम तितली अभयारण्य (Aralam Butterfly Sanctuary) किस राज्य में स्थित है?", "question_en": "In which state is the Aralam Butterfly Sanctuary located?", "options": {"A": "तमिलनाडु / Tamil Nadu", "B": "कर्नाटक / Karnataka", "C": "केरल / Kerala", "D": "असम / Assam"}, "answer": "C"},

    {"id": 10, "section": "GK", "question_hi": "पंडित रविशंकर किस वाद्य यंत्र से संबंधित थे?", "question_en": "Pandit Ravi Shankar was associated with which musical instrument?", "options": {"A": "तबला / Tabla", "B": "सितार / Sitar", "C": "सरोद / Sarod", "D": "पखावज / Pakhawaj"}, "answer": "B"},
    {"id": 11, "section": "GK", "question_hi": "'फिनॉल' को अन्य किस नाम से जाना जाता है?", "question_en": "Phenol is also known by which name?", "options": {"A": "कार्बोलिक अम्ल / Carbolic Acid", "B": "नाइट्रिक अम्ल / Nitric Acid", "C": "एसीटिक अम्ल / Acetic Acid", "D": "सल्फ्यूरिक अम्ल / Sulphuric Acid"}, "answer": "A"},
    {"id": 12, "section": "GK", "question_hi": "'योग्यतम की उत्तरजीविता' (Survival of the Fittest) के सिद्धांत का प्रतिपादन किसने किया था?", "question_en": "Who proposed the concept of 'Survival of the Fittest'?", "options": {"A": "चार्ल्स डार्विन / Charles Darwin", "B": "ग्रेगर मेंडल / Gregor Mendel", "C": "लैमार्क / Lamarck", "D": "अरस्तू / Aristotle"}, "answer": "A"},
    {"id": 13, "section": "GK", "question_hi": "'अजंता, एलोरा और एलिफेंटा' की गुफाएँ किस राज्य में स्थित हैं?", "question_en": "The caves of Ajanta, Ellora and Elephanta are located in which state?", "options": {"A": "मध्य प्रदेश / Madhya Pradesh", "B": "महाराष्ट्र / Maharashtra", "C": "गुजरात / Gujarat", "D": "कर्नाटक / Karnataka"}, "answer": "B"},
    {"id": 14, "section": "GK", "question_hi": "2014 का FIFA विश्व कप किस देश ने जीता था?", "question_en": "Which country won the 2014 FIFA World Cup?", "options": {"A": "ब्राजील / Brazil", "B": "अर्जेंटीना / Argentina", "C": "जर्मनी / Germany", "D": "स्पेन / Spain"}, "answer": "C"},
    {"id": 15, "section": "GK", "question_hi": "'लिंगराज मंदिर' कहाँ स्थित है?", "question_en": "Where is the 'Lingaraj Temple' located?", "options": {"A": "पुरी / Puri", "B": "भुवनेश्वर / Bhubaneswar", "C": "कोणार्क / Konark", "D": "कटक / Cuttack"}, "answer": "B"},
    {"id": 16, "section": "ENGLISH", "question_hi": "Choose the correct tense: She _____ to school every day.", "question_en": "She _____ to school every day.", "options": {"A": "go", "B": "goes", "C": "went", "D": "going"}, "answer": "B"},
    {"id": 17, "section": "ENGLISH", "question_hi": "Fill in the blank with the correct article: He is _____ honest man.", "question_en": "He is _____ honest man.", "options": {"A": "a", "B": "an", "C": "the", "D": "no article"}, "answer": "B"},
    {"id": 18, "section": "ENGLISH", "question_hi": "Choose the correct Passive Voice: Ram writes a letter.", "question_en": "Ram writes a letter. (Passive)", "options": {"A": "A letter is written by Ram.", "B": "A letter was written by Ram.", "C": "A letter has written by Ram.", "D": "A letter is being written by Ram."}, "answer": "A"},
    {"id": 19, "section": "ENGLISH", "question_hi": "Change into Indirect Speech: He said, “I am happy.”", "question_en": "He said, “I am happy.” (Indirect)", "options": {"A": "He said that I am happy.", "B": "He said that he was happy.", "C": "He says that he was happy.", "D": "He said that he is happy."}, "answer": "B"},
    {"id": 20, "section": "ENGLISH", "question_hi": "Find the error: She / do not / like tea.", "question_en": "She / do not / like tea. (Find Error)", "options": {"A": "She", "B": "do not", "C": "like tea", "D": "No error"}, "answer": "B"},
    {"id": 21, "section": "ENGLISH", "question_hi": "Fill in the blank: The boys are playing _____ the field.", "question_en": "The boys are playing _____ the field.", "options": {"A": "in", "B": "on", "C": "at", "D": "by"}, "answer": "A"},
    {"id": 22, "section": "ENGLISH", "question_hi": "Choose the correct sentence:", "question_en": "Choose the correct sentence:", "options": {"A": "He go to school every day.", "B": "He going to school every day.", "C": "He goes to school every day.", "D": "He gone to school every day."}, "answer": "C"},
    {"id": 23, "section": "ENGLISH", "question_hi": "Choose the correctly punctuated sentence:", "question_en": "Choose the correctly punctuated sentence:", "options": {"A": "What is your name.", "B": "What is your name?", "C": "what is your name?", "D": "What is your name,"}, "answer": "B"},
    {"id": 24, "section": "ENGLISH", "question_hi": "Choose the correctly capitalized sentence:", "question_en": "Choose the correctly capitalized sentence:", "options": {"A": "india is a great country.", "B": "India is a great country.", "C": "india Is a Great country.", "D": "India Is a great Country."}, "answer": "B"},
    {"id": 25, "section": "ENGLISH", "question_hi": "Choose the synonym of “Brave”:", "question_en": "Synonym of Brave:", "options": {"A": "Coward", "B": "Weak", "C": "Courageous", "D": "Lazy"}, "answer": "C"},
    {"id": 26, "section": "ENGLISH", "question_hi": "Choose the antonym of “Ancient”:", "question_en": "Antonym of Ancient:", "options": {"A": "Old", "B": "Modern", "C": "Historic", "D": "Past"}, "answer": "B"},
    {"id": 27, "section": "ENGLISH", "question_hi": "Choose the correct one-word substitution: A person who cannot read or write", "question_en": "A person who cannot read or write", "options": {"A": "Literate", "B": "Scholar", "C": "Illiterate", "D": "Teacher"}, "answer": "C"},
    {"id": 28, "section": "ENGLISH", "question_hi": "Choose the correct meaning of the idiom “A piece of cake”:", "question_en": "Meaning of 'A piece of cake':", "options": {"A": "Something very difficult", "B": "Something very easy", "C": "To eat a cake", "D": "To waste time"}, "answer": "B"},
    {"id": 29, "section": "ENGLISH", "question_hi": "Choose the correctly spelt word:", "question_en": "Correctly spelt word:", "options": {"A": "Goverment", "B": "Government", "C": "Govarnment", "D": "Governmant"}, "answer": "B"},
    {"id": 30, "section": "ENGLISH", "question_hi": "Choose the correct sentence:", "question_en": "Choose the correct sentence:", "options": {"A": "She has completed her work.", "B": "She have completed her work.", "C": "She completed has her work.", "D": "She having completed her work."}, "answer": "A"}
  ]
};
document.getElementById('test-title').innerText = testData.title;
document.getElementById('test-subject').innerText = "Subject: " + testData.subject;
let quizHTML = '';
let currentSection = '';
testData.questions.forEach((q) => {
  if(currentSection !== q.section){
    currentSection = q.section;
    quizHTML += `<div class="section-title">📚 ${currentSection} - ${currentSection === 'GK' ? 'सामान्य ज्ञान' : 'English'}</div>`;
  }
  quizHTML += `<div class="question-box" id="qbox${q.id}">`;
  quizHTML += `<div class="q-no">Question ${q.id} [${q.section}]</div>`;
  quizHTML += `<div class="q-text">${q.question_hi}<br><span style="color:#666; font-size:14px; font-weight:400">${q.question_en}</span></div>`;
  quizHTML += `<div class="options">`;
  for(let key in q.options){ quizHTML += `<label><input type="radio" name="q${q.id}" value="${key}" style="margin-right:8px"> <b>${key}.</b> ${q.options[key]}</label>`; }
  quizHTML += `</div></div>`;
});
document.getElementById('quiz-form').innerHTML = quizHTML;
let time = 20 * 60; let timerInterval;
function startTimer(){
  timerInterval = setInterval(()=>{
    let m = Math.floor(time/60), s = time%60;
    document.getElementById('timer').innerText = `⏰ Time Left: ${m}:${s<10?'0':''}${s}`;
    if(time <= 0){ clearInterval(timerInterval); submitTest(); }
    time--;
  },1000);
}
function submitTest(){
  clearInterval(timerInterval);
  let score = 0;
  testData.questions.forEach((q) => {
    let selected = document.querySelector(`input[name="q${q.id}"]:checked`);
    let qbox = document.getElementById(`qbox${q.id}`);
    let allLabels = qbox.querySelectorAll('label');
    allLabels.forEach(label => {
        let input = label.querySelector('input');
        if(input.value === q.answer){ label.classList.add('correct-option'); }
        if(selected && input.value === selected.value && selected.value !== q.answer){ label.classList.add('wrong-option'); }
    });
    if(selected && selected.value === q.answer){ score++; }
    qbox.innerHTML += `<div class="answer">✅ Correct Answer: ${q.answer}. ${q.options[q.answer]}</div>`;
  });
  document.getElementById('result').innerText = `🏆 Final Score: ${score} / ${testData.questions.length}`;
  document.querySelector('.btn').style.display = 'none';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
