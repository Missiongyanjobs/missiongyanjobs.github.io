<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Indian Navy MR Mock Test 01 – 50 Q | Mission Gyan Jobs</title>
    <style>
        /* ── reset & vars ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --muted: #64748b;
            --primary: #0b3d91;
            --primary-light: #1a56b8;
            --accent: #38bdf8;
            --radius: 14px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            --transition: 0.2s ease;
        }
        body.dark {
            --bg: #020617;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --muted: #94a3b8;
            --primary: #1e3a8a;
            --primary-light: #2563eb;
        }
        body {
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            font-size: 15px;
        }

        /* ── scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 12px;
        }

        /* ── header ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #020617;
            color: #fff;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            color: #7dd3fc;
            letter-spacing: 0.3px;
        }
        .header-brand span {
            background: #0c4a6e;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 10px;
            color: #bae6fd;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timer {
            border: 2px solid #7dd3fc;
            background: #0c4a6e;
            color: #7dd3fc;
            padding: 5px 16px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }
        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #334155;
            background: #1e293b;
            color: #38bdf8;
            font-size: 18px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: 0.2s;
        }
        .theme-toggle:hover {
            background: #0f172a;
            border-color: #38bdf8;
        }

        /* ── container ── */
        .container {
            max-width: 880px;
            margin: 16px auto;
            padding: 0 14px;
        }

        /* ── cards ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition);
        }

        /* ── info bar ── */
        .info-bar {
            border-left: 5px solid var(--primary);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .info-bar .title {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary);
        }
        .info-bar .meta {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }
        .info-bar .meta strong {
            color: var(--text);
        }

        /* ── question card ── */
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .q-header .q-label {
            font-weight: 700;
            font-size: 13px;
            color: var(--primary);
            letter-spacing: 0.3px;
        }
        .q-header .q-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 12px;
            border-radius: 30px;
        }
        #qHi {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.5;
        }
        #qEn {
            font-size: 14px;
            color: var(--muted);
            margin-top: 4px;
            font-weight: 400;
        }

        /* ── options ── */
        .options label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 16px;
            margin: 10px 0;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            background: var(--card);
            transition: all 0.15s ease;
        }
        .options label:hover {
            border-color: var(--accent);
            background: var(--bg);
        }
        .options label.sel {
            border-color: var(--primary) !important;
            background: #dbeafe !important;
            color: #1e3a8a !important;
        }
        body.dark .options label.sel {
            background: #1e3a8a !important;
            color: #bae6fd !important;
            border-color: #60a5fa !important;
        }
        .circle {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            border: 2px solid #94a3b8;
            background: var(--bg);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 14px;
            transition: 0.15s;
        }
        .options label.sel .circle {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        /* ── buttons ── */
        .btn {
            padding: 12px 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-ghost {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            background: var(--border);
        }
        .btn-yellow {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fbbf24;
        }
        .btn-yellow:hover {
            background: #fde68a;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            flex: 1.6;
        }
        .btn-primary:hover {
            background: var(--primary-light);
        }
        .btn-green {
            background: #16a34a;
            color: #fff;
            flex: 1;
        }
        .btn-green:hover {
            background: #15803d;
        }
        .btn-danger {
            background: #dc2626;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-outline-light {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-outline-light:hover {
            background: var(--bg);
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
        }
        .action-row-2 {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        /* ── palette ── */
        .p-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .p {
            height: 44px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.12s ease;
            color: var(--text);
        }
        .p:hover {
            transform: scale(1.04);
            border-color: var(--accent);
        }
        .p.cur {
            background: #ef4444 !important;
            color: #fff !important;
            border-color: #ef4444 !important;
        }
        .p.ans {
            background: #10b981 !important;
            color: #fff !important;
            border-color: #10b981 !important;
        }
        .p.rev {
            background: #fbbf24 !important;
            color: #000 !important;
            border-color: #fbbf24 !important;
        }

        /* ── overlays ── */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
            backdrop-filter: blur(6px);
        }
        #loginScreen {
            background: rgba(2, 6, 23, 0.92);
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #0f172a;
            padding: 28px 26px;
            border-radius: 24px;
            border: 2px solid var(--accent);
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .login-box h2 {
            color: var(--accent);
            margin-bottom: 2px;
        }
        .login-box .sub {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            margin: 6px 0;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            outline: none;
            background: #1e293b;
            color: #fff;
            transition: 0.15s;
        }
        .login-box input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }
        .login-box input::placeholder {
            color: #64748b;
            font-weight: 400;
        }
        .err-msg {
            color: #f87171;
            font-size: 12px;
            font-weight: 700;
            margin-top: 2px;
            display: none;
            text-align: left;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 16px;
            color: #020617;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }
        .login-btn:hover {
            background: #7dd3fc;
            transform: scale(1.01);
        }

        #passScreen {
            background: rgba(0, 0, 0, 0.94);
        }
        .pass-box {
            background: linear-gradient(145deg, #020617, #0b3d91);
            padding: 32px 28px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 3px solid var(--accent);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }
        .pass-box h2 {
            color: #7dd3fc;
            margin-bottom: 4px;
        }
        .pass-box .sub {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 14px;
        }
        .pass-box input {
            width: 100%;
            padding: 14px;
            border: 3px solid var(--accent);
            border-radius: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 16px;
            outline: none;
            background: #1e293b;
            color: #fff;
        }
        .pass-box input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }
        .pass-box .login-btn {
            margin-top: 14px;
        }
        #passErr {
            color: #f87171;
            display: none;
            margin-top: 10px;
            font-weight: 700;
        }

        /* ── scorecard ── */
        .score-card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 24px;
            padding: 24px 22px;
            max-height: 96vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
        }
        .score-card .badge-top {
            background: #dbeafe;
            color: var(--primary);
            font-weight: 900;
            font-size: 11px;
            padding: 5px 16px;
            border-radius: 30px;
            display: inline-block;
            letter-spacing: 0.5px;
        }
        #scoreMsg {
            font-size: 24px;
            font-weight: 900;
            margin: 10px 0 4px;
        }
        .score-big {
            font-size: 52px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.2;
        }
        .score-big small {
            font-size: 20px;
            color: var(--muted);
            font-weight: 600;
        }
        .score-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }
        .score-stat {
            padding: 14px 8px;
            border-radius: 14px;
            text-align: center;
        }
        .score-stat b {
            font-size: 20px;
        }
        .score-stat small {
            display: block;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.8;
        }
        .stat-correct {
            background: #dcfce7;
            color: #065f46;
        }
        .stat-wrong {
            background: #fee2e2;
            color: #991b1b;
        }
        .stat-skip {
            background: #fef3c7;
            color: #92400e;
        }
        body.dark .stat-correct {
            background: #064e3b;
            color: #86efac;
        }
        body.dark .stat-wrong {
            background: #7f1d1d;
            color: #fca5a5;
        }
        body.dark .stat-skip {
            background: #78350f;
            color: #fcd34d;
        }

        /* ── review page ── */
        .review-page {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 10000;
            overflow-y: auto;
            padding: 14px;
            display: none;
        }
        .review-page .sticky-bar {
            position: sticky;
            top: 0;
            background: var(--card);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid var(--accent);
            margin-bottom: 14px;
            z-index: 5;
            box-shadow: var(--shadow);
        }
        .review-page .sticky-bar b {
            font-size: 16px;
        }
        .opt-item {
            padding: 11px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            margin: 6px 0;
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 14px;
            background: var(--card);
            transition: 0.1s;
        }
        .opt-item.correct-opt {
            background: #dcfce7 !important;
            border-color: #16a34a !important;
            color: #065f46 !important;
            font-weight: 700;
        }
        .opt-item.wrong-opt {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
            font-weight: 700;
        }
        body.dark .opt-item.correct-opt {
            background: #064e3b !important;
            color: #86efac !important;
        }
        body.dark .opt-item.wrong-opt {
            background: #7f1d1d !important;
            color: #fca5a5 !important;
        }
        .badge {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 900;
            display: inline-block;
        }
        .badge-correct {
            background: #dcfce7;
            color: #065f46;
        }
        .badge-wrong {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-skip {
            background: #fef3c7;
            color: #92400e;
        }
        body.dark .badge-correct {
            background: #064e3b;
            color: #86efac;
        }
        body.dark .badge-wrong {
            background: #7f1d1d;
            color: #fca5a5;
        }
        body.dark .badge-skip {
            background: #78350f;
            color: #fcd34d;
        }

        /* ── responsive ── */
        @media (max-width: 640px) {
            .header {
                padding: 8px 12px;
            }
            .header-brand {
                font-size: 13px;
            }
            .timer {
                font-size: 13px;
                padding: 4px 12px;
            }
            .container {
                padding: 0 8px;
                margin: 10px auto;
            }
            .card {
                padding: 14px 14px;
            }
            #qHi {
                font-size: 16px;
            }
            .action-row {
                grid-template-columns: 1fr 1fr;
            }
            .action-row-2 {
                flex-wrap: wrap;
            }
            .action-row-2 .btn {
                flex: 1;

            }
            .p-grid {
                gap: 5px;
            }
            .p {
                height: 38px;
                font-size: 12px;
            }
            .score-card {
                padding: 18px 14px;
            }
            .score-big {
                font-size: 40px;
            }
            .login-box,
            .pass-box {
                padding: 22px 18px;
            }
            .review-page .sticky-bar {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

            .action-row {
                grid-template-columns: 1fr 1fr;

<body>

    <!-- ─── HEADER ─── -->
    <header class="header">
        <div class="header-brand">
            ⚓ MISSION GYAN JOBS
            <span>NAVY MR</span>
        </div>
        <div class="header-actions">
            <div class="timer">⏱️ <span id="timer">30:00</span></div>
            <button class="theme-toggle" onclick="document.body.classList.toggle('dark')" aria-label="Toggle theme">🌙</button>
        </div>
    </header>

    <!-- ─── LOGIN OVERLAY ─── -->
    <div class="overlay" id="loginScreen">
        <div class="login-box">
            <h2>👋 Welcome Students</h2>
            <p class="sub">Enter your name &amp; district to start the test</p>
            <input id="stuName" placeholder="Full Name *" autofocus>
            <div id="nameErr" class="err-msg">❌ Please enter your name</div>
            <input id="stuCity" placeholder="District / City *">
            <div id="cityErr" class="err-msg">❌ Please enter your district</div>
            <button class="login-btn" onclick="doLogin()">Continue →</button>
        </div>
    </div>

    <!-- ─── PASSWORD OVERLAY ─── -->
    <div class="overlay" id="passScreen" style="display:none">
        <div class="pass-box">
            <h2>⚓ TEST LOCKED</h2>
            <p class="sub">Enter the password to continue</p>
            <input type="password" id="passInput" placeholder="Password" autofocus>
            <button class="login-btn" onclick="checkPass()">UNLOCK &amp; START</button>
            <p id="passErr">❌ Wrong Password!</p>
        </div>
    </div>

    <!-- ─── MAIN TEST ─── -->
    <div class="container" id="mainTest" style="display:none">

        <!-- info bar -->
        <div class="card info-bar">
            <div class="title">🇮🇳 INDIAN NAVY AGNIVEER MR – MOCK TEST 01</div>
            <div class="meta">
                <strong>50</strong> Questions &nbsp;·&nbsp; <strong>50</strong> Marks &nbsp;·&nbsp; <strong>30</strong> Min &nbsp;·&nbsp; Negative <strong>0.25</strong>
                &nbsp;&nbsp;|&nbsp;&nbsp; <span id="attemptInfo">0/50</span>
            </div>
        </div>

        <!-- question card -->
        <div class="card">
            <div class="q-header">
                <span class="q-label">QUESTION <span id="qNo">1</span> / 50</span>
                <span class="q-badge" id="qStatus">Not Attempted</span>
            </div>
            <div id="qHi"></div>
            <div id="qEn"></div>
            <div id="optBox" class="options"></div>

            <div class="action-row">
                <button class="btn btn-ghost" onclick="prevQ()">← Prev</button>
                <button class="btn btn-ghost" onclick="clearAns()">✕ Clear</button>
                <button class="btn btn-yellow" onclick="markRev()">☆ Review</button>
            </div>
            <div class="action-row-2">
                <button class="btn btn-primary" onclick="saveNext()">Save &amp; Next →</button>
                <button class="btn btn-green" onclick="submitTest()">Submit</button>
            </div>
        </div>

        <!-- palette -->
        <div class="card">
            <b style="font-size:14px;">Question Palette — 50 Questions</b>
            <div class="p-grid" id="pGrid"></div>
            <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);">
                <span><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:#ef4444;vertical-align:middle;margin-right:4px;"></span> Current</span>
                <span><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:#10b981;vertical-align:middle;margin-right:4px;"></span> Attempted</span>
                <span><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:#fbbf24;vertical-align:middle;margin-right:4px;"></span> Review</span>
                <span><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--bg);border:1px solid var(--border);vertical-align:middle;margin-right:4px;"></span> Not Attempted</span>
            </div>
        </div>
    </div>

    <!-- ─── SCORECARD OVERLAY ─── -->
    <div class="overlay" id="scoreOverlay" style="display:none;background:rgba(2,6,23,0.92);">
        <div class="score-card">
            <div style="text-align:center;">
                <div class="badge-top">⚓ NAVY MR SCORECARD</div>
                <div id="scoreMsg" style="font-size:24px;font-weight:900;margin:10px 0 4px;"></div>
                <div class="score-big">
                    <span id="sBig">0</span><small> / 50</small>

            $('passScreen').style.display = 'flex';

            }
            optBox.innerHTML = html;

            // status badge
            if (answers[cur] !== undefined) {
                qStatus.innerText = answers[cur] === q.a ? '✅ Correct' : '❌ Wrong';
                qStatus.style.color = answers[cur] === q.a ? '#16a34a' : '#ef4444';
            } else if (reviews.has(cur)) {
                qStatus.innerText = '☆ Review';
                qStatus.style.color = '#fbbf24';
            } else {
                qStatus.innerText = 'Not Attempted';
                qStatus.style.color = 'var(--muted)';
            }

            // attempt count
            const attempted = Object.keys(answers).length;
            attemptInfo.innerText = `${attempted}/50 Attempted`;

            // palette
            let pg = '';
            for (let i = 0; i < testData.questions.length; i++) {
                let cls = 'p';
                if (i === cur) cls += ' cur';
                else if (reviews.has(i)) cls += ' rev';
                else if (answers[i] !== undefined) cls += ' ans';
                pg += `<div class="${cls}" onclick="jumpQ(${i})">${i + 1}</div>`;
            }
            pGrid.innerHTML = pg;
        }

        // ─── INTERACTIONS ──────────────────────────────────────
        function selAns(k) { answers[cur] = k;
            render(); }

        function clearAns() { delete answers[cur];
            render(); }

        function markRev() {
            if (reviews.has(cur)) reviews.delete(cur);
            else reviews.add(cur);
            render();
        }

        function saveNext() {
            if (cur < testData.questions.length - 1) { cur++;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' }); } else submitTest();
        }

        function prevQ() { if (cur > 0) { cur--;
                render(); } }

        function jumpQ(i) { cur = i;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // ─── SUBMIT ────────────────────────────────────────────
        function submitTest() {
            if (tInt) clearInterval(tInt);
            let cor = 0,
                wro = 0,
                skip = 0;
            testData.questions.forEach((q, i) => {
                if (answers[i] === undefined) skip++;
                else if (answers[i] === q.a) cor++;
                else wro++;
            });
            const finalMarks = cor * 1 - wro * 0.25;
            $('sCor').innerText = cor;
            $('sWro').innerText = wro;
            $('sSkip').innerText = skip;
            $('sBig').innerText = cor;
            $('finalScoreNeg').innerText = `Final Score (with Negative): ${finalMarks.toFixed(2)} / 50  (Correct ${cor} – Wrong ${wro}×0.25)`;

            let msg = '';
            if (cor >= 40) msg = '🏆 Excellent! Navy Topper ⚓';
            else if (cor >= 30) msg = '🚀 Great Job! Keep it up!';
            else if (cor >= 20) msg = '💪 Good, Keep Practicing!';
            else msg = '📚 Practice is Essential! Keep Learning!';
            $('scoreMsg').innerText = msg;

            const name = localStorage.getItem('mgj_name') || '—';
            const city = localStorage.getItem('mgj_city') || '—';
            $('stuInfoShow').innerText = `${name}  |  ${city}  |  ${new Date().toLocaleDateString()}`;

            $('scoreOverlay').style.display = 'flex';
            buildReview();
        }

        // ─── REVIEW ────────────────────────────────────────────
        function buildReview() {
            let html = '';
            testData.questions.forEach((q, i) => {
                const u = answers[i];
                const correct = u === q.a;
                let badgeClass = 'badge-skip',
                    label = '⚠️ Skipped';
                if (u !== undefined) {
                    if (correct) { badgeClass = 'badge-correct';
                        label = '✅ Correct'; } else { badgeClass = 'badge-wrong';
                        label = '❌ Wrong'; }
                }
                html += `<div class="card" style="border-left:6px solid ${correct ? '#16a34a' : u === undefined ? '#fbbf24' : '#ef4444'}">
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">
                        <b style="color:var(--primary);">Q ${i + 1}</b>
                        <span class="badge ${badgeClass}">${label}</span>
                    </div>
                    <div style="font-weight:800;font-size:17px;margin:6px 0;">${q.qh}</div>
                    <div style="color:var(--muted);font-size:13px;margin-bottom:8px;">${q.qe}</div>`;
                for (const k in q.o) {
                    let cls = 'opt-item';
                    if (k === q.a) cls += ' correct-opt';
                    else if (k === u && u !== q.a) cls += ' wrong-opt';
                    html += `<div class="${cls}"><b>${k}.</b> ${q.o[k]} ${k === q.a ? '✔️' : ''} ${k === u && k !== q.a ? '❌' : ''}</div>`;
                }
                html += `<div style="margin-top:8px;font-size:13px;color:var(--muted);">
                    <b>Your:</b> ${u || '—'} &nbsp;·&nbsp; <b>Correct:</b> ${q.a} (${q.o[q.a]})
                </div></div>`;
            });
            $('reviewList').innerHTML = html;
        }

        function openReview() { $('reviewPage').style.display = 'block'; }

        function closeReview() { $('reviewPage').style.display = 'none'; }

        // ─── ENTER KEY SUPPORT ────────────────────────────────
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if ($('loginScreen').style.display !== 'none') doLogin();
                else if ($('passScreen').style.display !== 'none') checkPass();
            }
        });

        // ─── RESTORE SESSION ──────────────────────────────────
        (function init() {
            const n = localStorage.getItem('mgj_name') || '';
            const c = localStorage.getItem('mgj_city') || '';
            if (n) $('stuName').value = n;
            if (c) $('stuCity').value = c;
        })();
    </script>
</body>
</html>
