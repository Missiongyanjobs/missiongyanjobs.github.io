<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR FORCE NON-COMBATANT 01/2027 - GK TEST 1 | Mission Gyan Jobs</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --border:#e2e8f0;
  --primary:#0f172a; --accent:#fbbf24; --red:#dc2626;
}
body.dark{
  --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --border:#334155;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:var(--bg);color:var(--text);transition:0.3s}
.header{position:sticky;top:0;z-index:100;background:var(--primary);color:white;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--accent)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900}.logo span{color:var(--accent)}
.top-bar{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;background:#1e293b;color:white;display:grid;place-items:center;font-size:16px}
.timer{border:2px solid #fecaca;background:#fef2f2;color:#dc2626;padding:6px 14px;border-radius:20px;font-weight:900;animation:blink 1s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0.6}}
.container{max-width:850px;margin:12px auto;padding:0 10px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.info-card b{font-size:13px}.info-card small{color:#64748b}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,0.07)}
.q-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lang{display:flex;gap:6px}.lang span{padding:5px 12px;border-radius:20px;border:1.5px solid #2563eb;font-size:12px;font-weight:700;cursor:pointer}
.lang span.active{background:#2563eb;color:white}
.q-text{font-size:16px;font-weight:700;margin:12px 0 2px}.q-en{font-size:13px;color:#64748b;margin-bottom:10px}
.options label{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 0;background:var(--card);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:0.2s}
.options label:hover{border-color:#ef4444;transform:translateX(4px)}.options label.sel{border-color:#16a34a;background:#dcfce7;color:#065f46}
body.dark.options label.sel{background:#14532d;color:white}
.circle{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:14px}
.btn{padding:11px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-g{ background:#e2e8f0; color:#0f172a} body.dark.btn-g{background:#334155;color:white}
.btn-y{ background:#fef3c7; color:#92400e}.btn-b{ background:#1d4ed8; color:white}.btn-gr{ background:#16a34a; color:white}
.p-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}
.p-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:10px}
.p{height:38px;border-radius:8px;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;font-weight:800;cursor:pointer}
.p.cur{background:#ef4444;color:white;border-color:#991b1b;transform:scale(1.08)}.p.ans{background:#10b981;color:white}.p.rev{background:#fbbf24;color:#000}
.finish{width:100%;background:linear-gradient(90deg,#dc2626,#991b1b);color:white;padding:12px;border:none;border-radius:10px;font-weight:900;margin-top:14px;cursor:pointer}
.correct-option{border:2px solid #16a34a!important;background:#dcfce7!important;color:#065f46!important}
.wrong-option{border:2px solid #dc2626!important;background:#fee2e2!important;color:#991b1b!important}
.answer{margin-top:10px;padding:8px;background:#dcfce7;border-left:4px solid #16a34a;font-weight:700;font-size:13px;border-radius:4px}
body.dark.answer{background:#14532d;color:#bbf7d0}
#password-screen{position:fixed;inset:0;background:rgba(2,6,23,0.96);display:flex;justify-content:center;align-items:center;z-index:999}
.pass-box{background:linear-gradient(180deg,#8B0000,#ff0000);padding:28px;border-radius:16px;text-align:center;width:90%;max-width:380px;border:3px solid #fbbf24;box-shadow:0 0 30px red}
.pass-box h2{color:yellow;margin-bottom:10px}.pass-box p{color:white;margin-bottom:12px;font-size:13px}
.pass-box input{width:100%;padding:12px;border:3px solid yellow;border-radius:8px;text-align:center;font-weight:800}
.pass-box button{width:100%;margin-top:12px;padding:12px;background:yellow;color:#8B0000;border:none;border-radius:8px;font-weight:900;cursor:pointer}
#resultBox{font-size:22px;font-weight:900;text-align:center;padding:16px;border-radius:10px;margin-top:15px;background:#dcfce7;color:#065f46;display:none}
</style>
</head>
<body>

<div id="password-screen">
  <div class="pass-box">
    <h2>🔥 TEST LOCKED 🔥</h2>
    <p>Test start karne ke liye password dalo</p>
    <input type="password" id="passInput" placeholder="Password = MGE@77">
    <button onclick="checkPassword()">START TEST NOW</button>
    <p id="errorMsg" style="color:yellow;display:none;margin-top:10px;font-weight:800">❌ Galat Password!</p>
  </div>
</div>

<div class="header">
  <div class="logo">🛡️ <span>MISSION GYAN JOBS</span></div>
  <div class="top-bar">
    <div class="timer">⏱️ <span id="timer">20:00</span></div>
    <button class="icon-btn" onclick="toggleDark()" id="darkBtn">🌙</button>
  </div>
</div>

<div class="container" id="main-test" style="display:none;">
  <div class="info-card">
    <b id="test-title"></b><br>
    <small id="test-subject"></small><br>
    <span style="color:#16a34a;font-weight:800;font-size:12px">25 Questions | 20 Mins | 1 Mark Each | Bilingual</span>
  </div>

  <div class="q-card">
    <div class="q-head">
      <b style="color:#2563eb">Question <span id="qNo">1</span> of 25</b>
      <div class="lang">
        <span class="active" id="lb" onclick="setLang('both')">Bilingual</span>
        <span id="lh" onclick="setLang('hi')">हिंदी</span>
        <span id="le" onclick="setLang('en')">English</span>
      </div>
    </div>
    <div class="q-text" id="qHi"></div>
    <div class="q-en" id="qEn"></div>
    <div class="options" id="optBox"></div>
    <div id="ansExplain"></div>

    <div class="ctrl">
      <button class="btn btn-g" onclick="prevQ()">← Previous</button>
      <button class="btn btn-g" onclick="clearAns()">Clear</button>
      <button class="btn btn-y" onclick="markReview()">☆ Mark for Review</button>
    </div>
    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:8px">
      <button class="btn btn-b" onclick="saveNext()">Save & Next →</button>
      <button class="btn btn-gr" onclick="submitTest()">Submit Test</button>
    </div>
  </div>

  <div class="p-card">
    <b>Question Palette</b>
    <div style="font-size:11px;display:flex;gap:10px;margin:6px 0;flex-wrap:wrap">
      <span>🟩 Answered</span><span>🟥 Current</span><span>🟨 Review</span><span>⬜ Not Visited</span>
    </div>
    <div class="p-grid" id="pGrid"></div>
    <button class="finish" onclick="submitTest()">🔥 Finish Test & View Score</button>
    <div id="resultBox"></div>
  </div>
</div>

<script>
const correctPass="MGE@77";
function checkPassword(){
  if(document.getElementById('passInput').value===correctPass){
    document.getElementById('password-screen').style.display='none';
    document.getElementById('main-test').style.display='block';
    startTimer(); renderQ();
  }else document.getElementById('errorMsg').style.display='block';
}
function toggleDark(){
  document.body.classList.toggle('dark');
  document.getElementById('darkBtn').innerText=document.body.classList.contains('dark')?'☀️':'🌙';
}

document.getElementById('test-title').innerText=testData.title;
document.getElementById('test-subject').innerText=testData.subject;

let cur=0, answers={}, visited=new Set([0]), reviews=new Set(), lang='both', timerInt, time=20*60;

function startTimer(){
  timerInt=setInterval(()=>{
    time--; let m=Math.floor(time/60), s=time%60;
    document.getElementById('timer').innerText=`${m}:${s<10?'0':''}${s}`;
    if(time<=0){clearInterval(timerInt); submitTest();}
  },1000);
}

function renderQ(){
  visited.add(cur);
  let q=testData.questions[cur];
  document.getElementById('qNo').innerText=cur+1;
  document.getElementById('qHi').innerText=q.qh;
  document.getElementById('qEn').innerText=q.qe;
  setLang(lang);
  let html="";
  for(let k in q.o){
    let sel=answers[cur]==k? 'sel' : '';
    html+=`<label class="${sel}" onclick="selectAns('${k}')"><div class="circle">${k}</div><div>${q.o[k]}</div></label>`;
  }
  document.getElementById('optBox').innerHTML=html;
  renderPalette();
}

function selectAns(k){answers[cur]=k; renderQ();}
function clearAns(){delete answers[cur]; renderQ();}
function markReview(){ if(reviews.has(cur)) reviews.delete(cur); else reviews.add(cur); renderQ(); }
function saveNext(){ visited.add(cur); if(cur<testData.questions.length-1){cur++; renderQ();} else submitTest(); }
function prevQ(){ if(cur>0){cur--; renderQ();} }
function jump(i){cur=i; renderQ();}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang span').forEach(s=>s.classList.remove('active'));
  if(l=='both'){lb.classList.add('active'); qHi.style.display=''; qEn.style.display='';}
  if(l=='hi'){lh.classList.add('active'); qHi.style.display=''; qEn.style.display='none';}
  if(l=='en'){le.classList.add('active'); qHi.style.display='none'; qEn.style.display='';}
}

function renderPalette(){
  let h=""; testData.questions.forEach((_,i)=>{
    let cls="p"; if(i==cur) cls+=" cur"; else if(reviews.has(i)) cls+=" rev"; else if(answers[i]!=undefined) cls+=" ans";
    else if(!visited.has(i)) cls+="";
    h+=`<div class="${cls}" onclick="jump(${i})">${i+1}</div>`;
  });
  document.getElementById('pGrid').innerHTML=h;
}

function submitTest(){
  clearInterval(timerInt);
  let score=0;
  testData.questions.forEach((q,i)=>{
    let correct=q.a;
    if(answers[i]==correct) score++;
  });
  // Show all answers with colors in current view
  let q=testData.questions[cur];
  let box=document.getElementById('optBox');
  let html="";
  for(let k in q.o){
    let cls=""; if(k==q.a) cls="correct-option"; else if(answers[cur]==k && k!=q.a) cls="wrong-option";
    html+=`<label class="${cls}"><div class="circle">${k}</div><div>${q.o[k]}</div></label>`;
  }
  box.innerHTML=html;
  document.getElementById('ansExplain').innerHTML=`<div class="answer">✅ Correct: ${q.a}. ${q.o[q.a]}</div>`;

  let rb=document.getElementById('resultBox');
  rb.style.display='block';
